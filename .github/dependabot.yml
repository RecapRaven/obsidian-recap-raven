version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:15'
      timezone: Europe/London
    open-pull-requests-limit: 5
    cooldown:
      default-days: 10
      include:
        - '*'
    groups:
      eslint-major:
        patterns:
          - eslint
          - '@eslint/*'
          - typescript-eslint
          - eslint-plugin-obsidianmd
        update-types:
          - major
      vitest-major:
        patterns:
          - vitest
          - '@vitest/*'
        update-types:
          - major
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:30'
      timezone: Europe/London
    open-pull-requests-limit: 5
    cooldown:
      default-days: 10
      include:
        - '*'
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:45'
      timezone: Europe/London
    open-pull-requests-limit: 2
    cooldown:
      default-days: 10
      include:
        - '*'
    groups:
      docker-images:
        patterns:
          - '*'
