version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: '05:15'
      timezone: Europe/London
    open-pull-requests-limit: 1
    cooldown:
      default-days: 10
      include:
        - '*'
    groups:
      eslint-major:
        patterns:
          - eslint
          - '@eslint/*'
          - typescript-eslint
          - eslint-plugin-obsidianmd
        update-types:
          - major
      vitest-major:
        patterns:
          - vitest
          - '@vitest/*'
        update-types:
          - major
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Match the compiler's Node API surface to the Node 22 LTS build image.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
      # typescript-eslint 8 currently supports TypeScript versions below 6.1.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: '05:30'
      timezone: Europe/London
    open-pull-requests-limit: 1
    cooldown:
      default-days: 10
      include:
        - '*'
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
      time: '05:45'
      timezone: Europe/London
    open-pull-requests-limit: 1
    cooldown:
      default-days: 10
      include:
        - '*'
    groups:
      docker-images:
        patterns:
          - '*'
    ignore:
      # Stay on the Node 22 LTS image until a later LTS migration is intentional.
      - dependency-name: node
        update-types:
          - version-update:semver-major
