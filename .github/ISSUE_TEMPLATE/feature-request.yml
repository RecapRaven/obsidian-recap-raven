name: Feature request
description: Suggest a focused improvement to the Recap Raven Obsidian plugin.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or user problem would this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
      description: Describe the smallest useful behavior and any security or privacy implications.
    validations:
      required: true
